# Per-webapp JULI config (Tomcat reads WEB-INF/classes/logging.properties).
# Application logs go to the console (catalina.out); the financial audit trail
# (logger com.mishra.audit, see AuditLog) goes only to logs/banking-audit.<date>.log.
handlers = 1audit.org.apache.juli.AsyncFileHandler, java.util.logging.ConsoleHandler
.handlers = java.util.logging.ConsoleHandler

java.util.logging.ConsoleHandler.level = FINE
java.util.logging.ConsoleHandler.formatter = org.apache.juli.OneLineFormatter
java.util.logging.ConsoleHandler.encoding = UTF-8

1audit.org.apache.juli.AsyncFileHandler.level = INFO
1audit.org.apache.juli.AsyncFileHandler.directory = ${catalina.base}/logs
1audit.org.apache.juli.AsyncFileHandler.prefix = banking-audit.
1audit.org.apache.juli.AsyncFileHandler.maxDays = 400
1audit.org.apache.juli.AsyncFileHandler.encoding = UTF-8
1audit.org.apache.juli.AsyncFileHandler.formatter = org.apache.juli.OneLineFormatter

com.mishra.audit.level = INFO
com.mishra.audit.handlers = 1audit.org.apache.juli.AsyncFileHandler
com.mishra.audit.useParentHandlers = false
