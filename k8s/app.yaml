apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: banking-app
  template:
    metadata:
      labels:
        app: banking-app
    spec:
      containers:
        - name: tomcat
          image: online-banking:local
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_URL
              value: jdbc:postgresql://banking-db:5432/javaclass
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: banking-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-db
                  key: DB_PASSWORD
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /CSCI6810/login.html
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /CSCI6810/login.html
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: banking-app
spec:
  type: NodePort
  selector:
    app: banking-app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
