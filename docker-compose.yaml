services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: javaclass
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d javaclass"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/javaclass
      DB_USER: banking
      DB_PASSWORD: banking
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
